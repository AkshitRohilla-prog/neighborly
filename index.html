<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighborly</title>
<meta name="description" content="Share extra food with your neighbors before it goes to waste.">
<meta name="theme-color" content="#2E6B3F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232E6B3F' d='M20 4C11 4 5 8.5 5 15c0 1.6.4 3 1 4.2C7.5 14 11 10.5 15 9c-3.4 2.2-6 5.4-7.4 10.4.9.4 2 .6 3.1.6C17 20 20 13 20 4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1E8; --card:#FFFFFF; --ink:#1E2B20; --muted:#55624F; --soft:#6B7566;
  --line:#E3DFD2; --line2:#D9D4C4;
  --green:#2E6B3F; --green-dk:#1E4A2A; --green-lt:#E6EEDB; --green-md:#D7E3CC;
  --warn:#8A3410; --warn-bg:#FBE3D6; --warn-line:#B4531F;
  --radius:20px; --shadow:0 2px 10px rgba(30,43,32,.06);
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;padding-bottom:84px}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #7FB08A;outline-offset:2px;border-radius:8px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,241,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid transparent}
.topbar .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--green-dk)}
.logo b{font-family:var(--serif);font-size:24px;font-weight:700}
.loc{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.topnav{display:none;gap:4px;margin-left:auto}
.topnav a{padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.topnav a.on{background:var(--green-lt);color:var(--green-dk);font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:14px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;position:relative}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:9px;background:#D2691E}

/* ---------- bottom tabs (phone) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;font-size:11px;font-weight:500;color:var(--soft)}
.tabbar a.on{color:var(--green);font-weight:700}

main{max-width:1120px;margin:0 auto;padding:0 16px 32px}
h1,h2,h3{margin:0}
.serif{font-family:var(--serif);font-weight:700}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;border:1.5px solid var(--green);background:var(--green);color:#fff}
.btn:hover{background:var(--green-dk);border-color:var(--green-dk)}
.btn.ghost{background:#fff;color:var(--green)}
.btn.ghost:hover{background:var(--green-lt)}
.btn.dark{background:var(--ink);border-color:var(--ink)}
.btn.danger{background:#fff;color:var(--warn);border-color:var(--line2)}
.btn.sm{min-height:44px;font-size:14px;padding:0 16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:none;color:var(--warn);font-weight:700;font-size:14px;min-height:44px;padding:0 8px}

/* ---------- chips & badges ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex-shrink:0;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.chip.diet[aria-pressed="true"]{background:var(--green-lt);border-color:var(--green);color:var(--green-dk)}
.chip.warn[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--green-lt);color:var(--green-dk);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.grey{background:#ECE8DC;color:var(--muted)}
.badge.alert{background:var(--warn);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:5px}

/* ---------- home ---------- */
.hero3d{--deep:#12301F;--glow:#F0912F;--cream:#F4F1E8;--ease:cubic-bezier(.2,.8,.2,1);
  position:relative;isolation:isolate;overflow:hidden;color:var(--cream);
  width:100vw;margin-left:calc(50% - 50vw);              /* full width, even though <main> is narrower */
  min-height:calc(100svh - 150px);display:flex;align-items:flex-end;
  background:radial-gradient(120% 90% at 75% 40%,#2a6a45 0%,#1E4A2A 38%,#12301F 100%)}
.hero3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y;opacity:0;transition:opacity .9s var(--ease)}
.hero3d.ready canvas{opacity:1}
.hero3d::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(0deg,rgba(18,48,31,.94) 0%,rgba(18,48,31,.78) 42%,rgba(18,48,31,0) 74%)}
.hero3d .inner{position:relative;z-index:2;width:100%;max-width:1120px;margin:0 auto;padding:96px 16px 40px}
.hero3d .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#CFE3BF;opacity:0;animation:heroFade .8s var(--ease) .05s forwards}
.hero3d .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow)}
.hero3d .headline{margin:0;font-family:'Anton','Oswald','Arial Narrow',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.94;letter-spacing:.005em;font-size:clamp(52px,8.8vw,128px)}
.hero3d .headline .ln{display:block;overflow:hidden;padding-bottom:.05em}
.hero3d .headline .ln>span{display:block;transform:translateY(112%);animation:heroRise .9s var(--ease) forwards;animation-delay:calc(.15s + var(--i)*.14s)}
.hero3d .headline .accent{color:var(--glow)}
@keyframes heroRise{to{transform:none}}
@keyframes heroFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero3d .lede{max-width:34ch;margin:22px 0 0;font-size:clamp(16px,2.2vw,20px);color:#E6EEDB;opacity:0;animation:heroFade .8s var(--ease) .75s forwards}
.hero3d .ctas{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:28px;opacity:0;animation:heroFade .8s var(--ease) .9s forwards}
.hero3d .btn{transition:transform .35s var(--ease),box-shadow .35s var(--ease),background-color .35s var(--ease)}
.hero3d .btn.primary{background:var(--cream);border-color:var(--cream);color:var(--green-dk)}
.hero3d .btn.ghost{background:transparent;border-color:rgba(244,241,232,.6);color:var(--cream)}
.hero3d .btn:hover,.hero3d .btn:focus-visible{transform:translateY(-3px)}
.hero3d .btn.primary:hover{background:var(--cream);border-color:var(--cream);box-shadow:0 12px 26px rgba(0,0,0,.3)}
.hero3d .btn.ghost:hover{background:rgba(244,241,232,.12)}
.hero3d .ulink{color:var(--cream);text-decoration:none;font-weight:700;padding:6px 0;background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size .4s var(--ease)}
.hero3d .ulink:hover,.hero3d .ulink:focus-visible{background-size:100% 2px}
.hero3d :focus-visible{outline-color:#9CC7A5}
/* no WebGL, reduced motion or data saver: a static glow instead of the 3D scene */
.hero3d.no-webgl canvas{display:none}
.hero3d.no-webgl::before{content:"";position:absolute;z-index:0;right:50%;transform:translateX(50%);top:6%;width:52vmin;height:52vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(240,145,47,.85) 0%,rgba(240,145,47,.25) 42%,transparent 70%)}
#how{scroll-margin-top:72px}
body{overflow-x:hidden}
@media (prefers-reduced-motion:reduce){
  .hero3d .headline .ln>span{transform:none;animation:none}
  .hero3d .eyebrow,.hero3d .lede,.hero3d .ctas{opacity:1;animation:none}
  .hero3d .btn,.hero3d .ulink,.hero3d canvas{transition:none}
  .hero3d .btn:hover{transform:none}
}
.steps{display:grid;gap:10px;margin-top:16px}
.step{background:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.step i{font-style:normal;width:34px;height:34px;flex-shrink:0;border-radius:99px;background:var(--green-md);color:var(--green-dk);font-weight:700;display:flex;align-items:center;justify-content:center}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 10px}
.sechead h2{font-size:19px}
.sechead a{font-size:14px;font-weight:700;text-decoration:none;padding:8px 0}
.alertcard{margin-top:16px;padding:16px;border-radius:20px;background:var(--green-dk);color:#fff;display:flex;gap:12px;align-items:center}
.alertcard small{display:block;color:#CFE3BF;font-size:13px}

/* ---------- food cards ---------- */
.list{display:grid;gap:12px}
.card{display:flex;gap:12px;background:var(--card);border-radius:var(--radius);padding:10px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--green-md);transform:translateY(-1px)}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .name{font-weight:700;font-size:16px;line-height:1.25}
.card .meta{font-size:13px;color:var(--muted)}
.card .by{font-size:12px;color:var(--soft);display:flex;align-items:center;gap:6px;margin-top:auto}
.card.gone{opacity:.6;box-shadow:none;background:#EBE8DE}
.tile{width:92px;height:92px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:rgba(30,43,32,.55)}
.tile img{width:100%;height:100%;object-fit:cover}
.av{width:22px;height:22px;border-radius:99px;background:var(--green-md);color:var(--green-dk);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:#fff;border-radius:var(--radius);grid-column:1/-1}

/* ---------- discover ---------- */
.search{display:flex;align-items:center;gap:8px;height:50px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);margin-top:14px}
.search input{border:none;outline:none;background:transparent;flex:1;min-width:0;font-size:16px}
.pagehead{margin:18px 4px 0}
.pagehead h1{font-family:var(--serif);font-size:30px}
.pagehead p{margin:4px 0 0;color:var(--muted)}

/* ---------- details ---------- */
.detail{display:grid;gap:0;margin:0 -16px}
.photo{height:280px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .back{position:absolute;top:14px;left:14px;width:44px;height:44px;border-radius:99px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.photo .badge{position:absolute;bottom:34px;left:16px;height:32px;font-size:14px;padding:0 12px}
.info{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding:22px 20px 8px;display:flex;flex-direction:column;gap:18px}
.info h1{font-family:var(--serif);font-size:30px;line-height:1.1}
.facts{display:grid;gap:10px}
.fact{display:flex;gap:10px;align-items:center}
.fact svg{color:var(--green);flex-shrink:0}
.warnbox{background:var(--warn-bg);border-radius:16px;padding:12px 14px;display:flex;gap:10px;color:#6E2A0C;font-size:14px}
.warnbox svg{color:var(--warn);flex-shrink:0}
.person{background:#fff;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}
.person .av{width:44px;height:44px;font-size:16px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;font-size:20px}
.stepper output{min-width:28px;text-align:center;font-size:20px;font-weight:700}
.claimrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel{background:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}

/* ---------- forms ---------- */
.narrow{max-width:600px;margin:0 auto}
.form{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:14px;font-weight:700;padding:0}
.field small{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{min-height:50px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;width:100%;min-width:0}
.field textarea{padding:12px 14px;min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(46,107,63,.15)}
fieldset{border:none;margin:0;padding:0;min-width:0}
fieldset legend{margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qty{display:grid;grid-template-columns:1fr 1.2fr;gap:8px}
.photopick{height:130px;border:1.5px dashed #BFC8B4;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#3F4D3B;font-weight:500;font-size:14px;overflow:hidden;position:relative;cursor:pointer}
.photopick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photopick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.err{color:var(--warn);font-size:13px;font-weight:700}
.field.bad input{border-color:var(--warn-line)}

/* ---------- claims / profile ---------- */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#E9E5D8;border-radius:999px;padding:4px;margin-top:14px;max-width:520px}
.seg button{min-height:42px;border:none;border-radius:999px;background:transparent;font-size:14px;font-weight:500;color:#3F4D3B}
.seg button[aria-selected="true"]{background:var(--green);color:#fff;font-weight:700}
.item{background:#fff;border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.item .top{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.item .tile{width:64px;height:64px}
.item .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bar{height:8px;border-radius:99px;background:#EEF2E8;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green);border-radius:99px}
.profilehead{display:flex;align-items:center;gap:14px;margin-top:20px}
.profilehead .av{width:64px;height:64px;font-size:26px}
.impact{margin-top:18px;padding:18px;border-radius:22px;background:var(--green-lt)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;text-align:center}
.stats div{background:#fff;border-radius:16px;padding:12px 6px}
.stats b{display:block;font-family:var(--serif);font-size:26px;color:var(--green-dk)}
.stats span{font-size:12px;color:var(--muted)}
.done{text-align:center;padding-top:16px}
.done h1{font-family:var(--serif);font-size:34px;color:var(--green-dk);margin-top:10px}

/* ---------- accounts and buildings ---------- */
.topauth{margin-left:auto;display:flex;align-items:center;gap:8px}
.topauth .btn{min-height:40px;font-size:14px;padding:0 16px}
.hide-sm{display:none}
.iconbtn.soon{opacity:.45}
.avchip{width:40px;height:40px;border-radius:99px;background:var(--green-md);color:var(--green-dk);font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--green-lt);color:var(--green-dk);font-size:14px}
.note.demo{background:#FFF3D6;color:#6B4E00}
.note a{color:inherit}
.pw{position:relative;display:flex}
.pw input{padding-right:84px}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:40px;padding:0 12px;border:none;background:transparent;color:var(--green);font-weight:700;border-radius:10px}
.strength{height:6px;border-radius:99px;background:#EEF2E8;overflow:hidden}
.strength span{display:block;height:100%;width:0;border-radius:99px;transition:width .3s cubic-bezier(.2,.8,.2,1),background-color .3s}
.rules .check{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
.rules .check input{width:22px;height:22px;flex-shrink:0;margin:2px 0 0;accent-color:var(--green)}
.rules.bad .check{color:var(--warn);font-weight:700}
.field.bad legend{color:var(--warn)}
.field.bad .chips .chip{border-color:var(--warn-line)}
.center{text-align:center}
.codebox{font-size:clamp(28px,9vw,42px);letter-spacing:.14em;font-weight:700;color:var(--green-dk);background:var(--green-lt);border-radius:18px;padding:18px;text-align:center;user-select:all;word-break:break-all}
.members{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.members li{display:flex;align-items:center;gap:10px}
.linkbtn.inline{display:inline;min-height:0;padding:0;color:var(--green);text-decoration:underline}
details summary{list-style:revert}
.toastbtn{background:none;border:none;color:#CFE3BF;font-weight:700;text-decoration:underline;min-height:44px;padding:0 8px}
#toast.act{pointer-events:auto}
main:focus{outline:none}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- bigger screens ---------- */
@media (min-width:700px){
  .list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stack2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media (min-width:900px){
  .hero3d{min-height:min(86svh,780px)}
  .hero3d::after{background:linear-gradient(90deg,rgba(18,48,31,.78) 0%,rgba(18,48,31,.25) 45%,rgba(18,48,31,0) 62%)}
  .hero3d .inner{padding:96px 16px 56px}
  .hero3d.no-webgl::before{right:8%;transform:none;top:14%;width:46vmin;height:46vmin}
  body{padding-bottom:0}
  .tabbar{display:none}
  .topnav{display:flex}
  .topbar{border-bottom-color:var(--line)}
  #toast{bottom:32px}
  .topauth{margin-left:0}
  .hide-sm{display:inline-flex}
  .detail{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;margin:24px 0 0;align-items:start}
  .photo{height:460px;border-radius:26px;position:sticky;top:90px}
  .photo .badge{bottom:16px}
  .info{margin-top:0;padding:0;background:transparent}
  .info h1{font-size:38px}
}
@media (min-width:1050px){
  .list.three{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="in">
    <a href="#/home" class="logo" aria-label="Neighborly home">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#2E6B3F" aria-hidden="true"><path d="M20 4C11 4 5 8.5 5 15c0 1.6.4 3 1 4.2C7.5 14 11 10.5 15 9c-3.4 2.2-6 5.4-7.4 10.4.9.4 2 .6 3.1.6C17 20 20 13 20 4z"/></svg>
      <b>Neighborly</b>
    </a>
    <nav class="topnav" aria-label="Main" id="topnav"></nav>

<script>
'use strict';

/* =====================================================================
   HELPERS (small tools used everywhere)
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HOUR = 3600e3, MIN = 60e3;

let toastTimer;
function toast(msg, action) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('act', !!action);
  if (action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toastbtn'; b.textContent = action.label;
    b.addEventListener('click', () => { el.classList.remove('show'); action.run(); });
    el.append(' ', b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 7000 : 2800);
}

/* =====================================================================
   DATA LAYER  (DEMO MODE)
   ---------------------------------------------------------------------
   Everything below the "SCREENS" heading only talks to `Auth` and `DB`.
   Right now both keep their data in this browser (localStorage), so
   accounts and posts exist on this device only. No real email is sent.

   Version 2 plan: replace the functions inside `Auth` and `DB` with
   Firebase calls (Authentication + Firestore) and set APP.demo = false.
   The screens do not need to change.
   ===================================================================== */
const APP = { demo: true };
const STORAGE_KEY = 'neighborly-v2';
const DEMO_BUILDING = 'b-demo-b';

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const normEmail = (e) => String(e || '').trim().toLowerCase();
const normCode = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const COMMON_PW = ['password', 'password1', '12345678', '123456789', '1234567890', 'qwertyui', 'qwertz123', '11111111', 'neighborly', 'passwort', 'iloveyou'];
const DOMAIN_FIXES = { 'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com', 'gmail.con': 'gmail.com', 'gmail.co': 'gmail.com', 'gnail.com': 'gmail.com', 'hotmial.com': 'hotmail.com', 'hotmail.con': 'hotmail.com', 'yahooo.com': 'yahoo.com', 'yaho.com': 'yahoo.com', 'outlok.com': 'outlook.com', 'outlook.con': 'outlook.com', 'icloud.con': 'icloud.com' };
function emailTypo(email) {
  const [user, domain] = normEmail(email).split('@');
  return domain && DOMAIN_FIXES[domain] ? user + '@' + DOMAIN_FIXES[domain] : '';
}
function pwProblem(pw) {
  if (pw.length < 8) return 'Use at least 8 characters.';
  if (COMMON_PW.includes(pw.toLowerCase())) return 'That password is too easy to guess.';
  return '';
}
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no 0/O/1/I, so codes are easy to read out
function makeCode() {
  const bytes = new Uint8Array(8);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else bytes.forEach((_, i) => { bytes[i] = Math.floor(Math.random() * 256); });
  const s = Array.from(bytes, (b) => CODE_CHARS[b % CODE_CHARS.length]).join('');
  return s.slice(0, 4) + '-' + s.slice(4);
}
/* Demo only: passwords are salted and hashed, never stored as plain text.
   Real security arrives with Firebase Authentication in version 2. */
async function hashPassword(pw, salt) {
  const data = salt + '::' + pw;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; for (const ch of data) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
    return 'x' + (h >>> 0).toString(16);
  }
}

let state = null, persistOK = true;

function seed() {
  const now = Date.now();
  const neighbor = (name, building) => ({ id: 'u-' + name.toLowerCase(), name, email: null, demo: true, verified: true, buildingId: building, allergies: [], createdAt: now - 30 * 24 * HOUR });
  const post = (o) => ({ id: newId(), buildingId: DEMO_BUILDING, photo: null, gone: false, ...o });
  return {
    session: null,
    users: [
      neighbor('Lena', DEMO_BUILDING), neighbor('Mia', DEMO_BUILDING), neighbor('Jonas', DEMO_BUILDING),
      neighbor('Emma', DEMO_BUILDING), neighbor('Noah', DEMO_BUILDING), neighbor('Sara', 'b-demo-a')
    ],
    buildings: [
      { id: DEMO_BUILDING, name: 'Demo Building B', city: 'Berlin', postcode: '', code: 'DEMO-B', adminId: null,
        spots: ['Table by the mailboxes', 'Lobby fridge', 'Courtyard bench', 'Entrance shelf'], createdAt: now },
      { id: 'b-demo-a', name: 'Demo Building A', city: 'Berlin', postcode: '', code: 'DEMO-A', adminId: null,
        spots: ['Lobby shelf'], createdAt: now }
    ],
    posts: [
      post({ ownerId: 'u-lena', by: 'Lena', name: 'Vegetable biryani', category: 'Meal', total: 6, left: 6, unit: 'portions',
        cookedAt: now - 1 * HOUR, until: now + 2.5 * HOUR, spot: 'Table by the mailboxes',
        note: "Made too much for a party. It's covered with foil, please bring your own box!",

      post({ ownerId: 'u-mia', by: 'Mia', name: 'Birthday cake', category: 'Baked', total: 8, left: 5, unit: 'slices',
        cookedAt: now - 20 * HOUR, until: now + 45 * MIN, spot: 'Lobby fridge',
        note: 'Chocolate cake from my daughter’s birthday. Plates are next to it.',
        ingredients: 'Wheat flour, sugar, eggs, butter, milk, cocoa',
        tags: ['Vegetarian', 'Dairy', 'Gluten', 'Egg'], createdAt: now - 3 * HOUR }),
      post({ ownerId: 'u-jonas', by: 'Jonas', name: 'Garden tomatoes', category: 'Fruit & veg', total: 4, left: 4, unit: 'bags',
        cookedAt: now - 5 * HOUR, until: now + 22 * HOUR, spot: 'Courtyard bench',
        note: 'Picked this morning from the balcony garden. About half a kilo per bag.',
        ingredients: 'Tomatoes (home-grown, unwashed)',
        tags: ['Vegan'], createdAt: now - 2 * HOUR }),
      post({ ownerId: 'u-emma', by: 'Emma', name: 'Fresh lettuce', category: 'Fruit & veg', total: 3, left: 2, unit: 'heads',
        cookedAt: now - 6 * HOUR, until: now + 7 * HOUR, spot: 'Entrance shelf',
        note: 'Too much from the market box this week.',
        ingredients: 'Lettuce (unwashed)',
        tags: ['Vegan'], createdAt: now - 90 * MIN }),
      post({ ownerId: 'u-noah', by: 'Noah', name: 'Bread rolls', category: 'Baked', total: 10, left: 0, unit: 'pieces',
        cookedAt: now - 30 * HOUR, until: now - 18 * HOUR, spot: 'Lobby fridge',
        note: '', ingredients: 'Wheat flour, water, yeast, salt',
        tags: ['Vegan', 'Gluten'], createdAt: now - 28 * HOUR }),
      post({ buildingId: 'b-demo-a', ownerId: 'u-sara', by: 'Sara', name: 'Apple pie', category: 'Baked', total: 6, left: 6, unit: 'slices',
        cookedAt: now - 2 * HOUR, until: now + 8 * HOUR, spot: 'Lobby shelf',
        note: 'Still warm this afternoon.', ingredients: 'Apples, wheat flour, butter, sugar, eggs, cinnamon',
        tags: ['Vegetarian', 'Dairy', 'Gluten', 'Egg'], createdAt: now - 2 * HOUR })
    ],
    claims: [],
    reports: []
  };
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { persistOK = false; }
  try { state = raw ? JSON.parse(raw) : null; } catch (e) { state = null; }
  const ok = state && ['users', 'buildings', 'posts', 'claims'].every((k) => Array.isArray(state[k]));
  if (!ok) { state = seed(); saveState(true); }
  if (!Array.isArray(state.reports)) state.reports = [];
  refreshDemoFood();
}
/* Keeps the demo feed alive: when the sample neighbors' food has all expired, bring in fresh sample posts.
   Posts someone has claimed are kept so claim history stays intact. */
function refreshDemoFood() {
  const demoIds = new Set(state.users.filter((u) => u.demo).map((u) => u.id));
  const mine = state.posts.filter((p) => demoIds.has(p.ownerId));
  if (mine.filter((p) => p.until > Date.now() && !p.gone).length >= 2) return;
  const claimed = new Set(state.claims.map((c) => c.postId));
  state.posts = state.posts.filter((p) => !demoIds.has(p.ownerId) || claimed.has(p.id));
  state.posts.push(...seed().posts);
  saveState(true);
}
function saveState(quiet) {
  if (!persistOK) return true;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
  catch (e) { if (!quiet) toast('Could not save. Try a smaller photo.'); return false; }
}
const save = () => saveState(false);

/* removes everything a person owns in their building (used when they leave, are removed or delete the account) */
function dropUserData(userId) {
  const mine = state.posts.filter((p) => p.ownerId === userId).map((p) => p.id);
  state.claims = state.claims.filter((c) => !mine.includes(c.postId));
  state.posts = state.posts.filter((p) => p.ownerId !== userId);
  state.claims.filter((c) => c.userId === userId && c.status === 'ready').forEach((c) => {
    const p = state.posts.find((x) => x.id === c.postId);
    if (p) p.left = Math.min(p.total, p.left + c.portions);
  });
  state.claims = state.claims.filter((c) => c.userId !== userId);
}
function detachFromBuilding(u) {
  const bid = u.buildingId; if (!bid) return;
  dropUserData(u.id);
  u.buildingId = null;
  const b = state.buildings.find((x) => x.id === bid);
  if (b && b.adminId === u.id) {
    const next = state.users.find((x) => x.buildingId === bid && x.id !== u.id);
    if (next) b.adminId = next.id;
    else {                                    // last member left: the building disappears
      state.posts = state.posts.filter((p) => p.buildingId !== bid);
      state.buildings = state.buildings.filter((x) => x.id !== bid);
    }
  }
}

const claimedPortions = (postId) => state.claims.filter((c) => c.postId === postId && c.status !== 'returned').reduce((s, c) => s + c.portions, 0);

const Auth = {
  current() { return state.session ? state.users.find((u) => u.id === state.session) || null : null; },
  async signUp({ name, email, password }) {
    email = normEmail(email);
    if (state.users.some((u) => u.email === email)) return { error: 'exists' };
    const salt = newId();
    const user = { id: newId(), name: name.trim(), email, salt, hash: await hashPassword(password, salt),
      verified: false, buildingId: null, allergies: [], createdAt: Date.now() };
    state.users.push(user); state.session = user.id; save();
    return { user };
  },
  async logIn(email, password) {
    const u = state.users.find((x) => x.email && x.email === normEmail(email));
    if (!u || !u.hash || (await hashPassword(password, u.salt)) !== u.hash) return { error: 'bad' };
    state.session = u.id; save();
    return { user: u };
  },
  logOut() { state.session = null; save(); },
  sendVerification() { return true; },            // version 2: Firebase sendEmailVerification()
  verifyEmail() { const u = this.current(); if (u) { u.verified = true; save(); } },   // demo only: the "click the link" step
  async resetPassword(email, password) {          // version 2: Firebase sendPasswordResetEmail()
    const u = state.users.find((x) => x.email && x.email === normEmail(email));
    if (!u) return { error: 'none' };
    u.salt = newId(); u.hash = await hashPassword(password, u.salt); save();
    return { ok: true };
  },
  setProfile(changes) { const u = this.current(); if (u) { Object.assign(u, changes); save(); } },
  joinBuilding(code) {
    const u = this.current(); if (!u) return { error: 'login' };
    const b = state.buildings.find((x) => normCode(x.code) === normCode(code));
    if (!b) return { error: 'nocode' };
    if (u.buildingId !== b.id) { detachFromBuilding(u); u.buildingId = b.id; save(); }
    return { building: b };
  },
  createBuilding({ name, city, postcode, spots }) {
    const u = this.current(); if (!u) return null;
    detachFromBuilding(u);
    let code; do { code = makeCode(); } while (state.buildings.some((b) => normCode(b.code) === normCode(code)));
    const b = { id: newId(), name, city, postcode, code, adminId: u.id, spots, createdAt: Date.now() };
    state.buildings.push(b); u.buildingId = b.id; save();
    return b;
  },
  leaveBuilding() { const u = this.current(); if (u) { detachFromBuilding(u); save(); } },
  deleteAccount() {
    const u = this.current(); if (!u) return;
    detachFromBuilding(u);
    state.users = state.users.filter((x) => x.id !== u.id);
    state.session = null; save();
  }
};

const DB = {
  user: (id) => state.users.find((u) => u.id === id) || null,
  building: (id) => state.buildings.find((b) => b.id === id) || null,
  members: (bid) => state.users.filter((u) => u.buildingId === bid),
  regenerateCode(bid) {
    const b = this.building(bid); if (!b) return null;
    let code; do { code = makeCode(); } while (state.buildings.some((x) => normCode(x.code) === normCode(code)));
    b.code = code; save(); return code;
  },
  setSpots(bid, spots) { const b = this.building(bid); if (b) { b.spots = spots; save(); } },
  removeMember(adminId, userId) {
    const u = this.user(userId), b = u && this.building(u.buildingId);
    if (!u || !b || b.adminId !== adminId || userId === adminId) return false;
    detachFromBuilding(u); save(); return true;
  },

  posts: (bid) => state.posts.filter((p) => p.buildingId === bid),
  post: (id) => state.posts.find((p) => p.id === id) || null,
  addPost(user, data) {
    if (!user || !user.buildingId) return null;
    const total = data.total;
    const p = { ...data, id: newId(), buildingId: user.buildingId, ownerId: user.id, by: user.name, left: total, gone: false, createdAt: Date.now() };
    state.posts.unshift(p);
    if (!save()) { state.posts.shift(); return null; }
    return p;
  },
  updatePost(id, changes) { const p = this.post(id); if (p) { Object.assign(p, changes); save(); } },
  deletePost(id) {
    state.posts = state.posts.filter((p) => p.id !== id);
    state.claims = state.claims.filter((c) => c.postId !== id);
    save();
  },

  claimedPortions,
  claimsFor: (userId) => state.claims.filter((c) => c.userId === userId),
  claim: (id) => state.claims.find((c) => c.id === id) || null,
  /* Safe claiming: the checks live here, so a second person can never take portions that are gone. */
  makeClaim(postId, user, portions) {
    const p = this.post(postId);
    if (!p || !user || user.buildingId !== p.buildingId || p.ownerId === user.id) return null;
    if (p.gone || p.until <= Date.now() || !(portions >= 1) || p.left < portions) return null;
    p.left -= portions;
    const c = { id: newId(), postId, userId: user.id, portions, at: Date.now(), status: 'ready' };
    state.claims.unshift(c); save();
    return c;
  },
  setClaimStatus(id, status) {
    const c = this.claim(id); if (!c) return;
    if (status === 'returned' && c.status === 'ready') {
      const p = this.post(c.postId); if (p) p.left = Math.min(p.total, p.left + c.portions);
    }
    c.status = status; save();
  },

  addReport(postId, userId, reason, text) {
    state.reports.push({ id: newId(), postId, userId, reason, text, at: Date.now() }); save();
  },
  reset() { state = seed(); save(); }
};

loadState();

/* =====================================================================
   VIEW HELPERS
   ===================================================================== */
const WARN_TAGS = ['Nuts', 'Dairy', 'Gluten', 'Egg'];
const DIETS = [['Vegetarian', 'Vegetarian'], ['Vegan', 'Vegan'], ['Meat', 'Contains meat or fish']];
const tagLabel = (t) => (t === 'Meat' ? 'Contains meat or fish' : t);
const CATEGORIES = {
  'Meal':        { color: '#F0D49A', icon: '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/>' },

const svg = (name, size = 20, extra = '') =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICONS[name] || CATEGORIES[name]?.icon || ''}</svg>`;

/* who is looking, and which building's food do they see? */
const isMember = (u) => !!(u && u.verified && u.buildingId && DB.building(u.buildingId));
const viewBuildingId = () => { const u = Auth.current(); return isMember(u) ? u.buildingId : DEMO_BUILDING; };
const setupHref = (u) => (!u ? '#/login' : !u.verified ? '#/verify' : '#/join');

function timeLeft(until) {
  const d = until - Date.now();
  if (d <= 0) return { text: 'Expired', cls: 'grey' };
  const m = Math.round(d / MIN);
  if (m < 60) return { text: `${m} min left`, cls: 'alert' };
  const h = Math.floor(m / 60), rest = m % 60;
  if (h < 24) return { text: rest && h < 6 ? `${h}h ${rest}m left` : `${h}h left`, cls: h < 2 ? 'warn' : '' };
  return { text: `${Math.round(h / 24)}d left`, cls: '' };
}
function timeBadge(p) {
  if (p.gone || p.left <= 0) return `<span class="badge grey">All gone</span>`;
  const t = timeLeft(p.until);
  return `<span class="badge ${t.cls}" data-until="${p.until}">${t.text}</span>`;
}
function fmtWhen(ts) {
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const day = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (ts >= day && ts < day + 24 * HOUR) return `today ${hm}`;
  if (ts >= day + 24 * HOUR && ts < day + 48 * HOUR) return `tomorrow ${hm}`;
  if (ts >= day - 24 * HOUR && ts < day) return `yesterday ${hm}`;
  return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + hm;
}
function toLocalInput(ts) { const d = new Date(ts); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }

function tile(p, size) {

}

}

/* Shrinks a photo so it fits in browser storage. */
function readPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Decides where a person may go. Returns a hash to redirect to, or '' if the page is fine. */
function guard(r) {
  const u = Auth.current();
  if (r.guestOnly && u) return !u.verified ? '#/verify' : !isMember(u) ? '#/join' : '#/home';
  if (!r.needs) return '';
  const want = r.needs === 'member';             // only remember pages the person really wanted to open
  if (!u) { if (want) returnTo = location.hash; flash = r.flash || 'Log in to continue.'; return '#/login'; }
  if (r.needs === 'user') return u.verified ? (isMember(u) ? '#/home' : '#/join') : '';
  if (!u.verified) { if (want) returnTo = location.hash; return '#/verify'; }
  if (want && !isMember(u)) { returnTo = location.hash; return '#/join'; }
  return '';
}

function hiddenSpot() {
  const u = Auth.current();
  return !u ? 'Pickup spot shown after login' : (!u.verified ? 'Pickup spot shown after you confirm your email' : 'Pickup spot shown after you join a building');
}

function render(opts = {}) {
  const [, name = 'home', arg] = (location.hash || '#/home').split('/');
  const r = routes[name] || routes.home;
  const redirect = guard(r);
  if (redirect) { location.replace(location.pathname + location.search + redirect); return; }
  currentRoute = routes[name] ? name : 'home';
  homeRefresh = null;
  unmountHero();
  renderNav(r.tab);
  const app = $('#app'), y = window.scrollY;
  app.innerHTML = '';
  app.onclick = null;
  r.view(app, arg && decodeURIComponent(arg));
  if (opts.keepScroll) window.scrollTo(0, y);
  else { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
}
/* Another tab changed the data: pick it up instead of overwriting it, and redraw pages that have no form. */
window.addEventListener('storage', (e) => {
  if (e.key !== STORAGE_KEY || !persistOK) return;
  try { const n = JSON.parse(e.newValue); if (n && Array.isArray(n.users)) state = n; else return; } catch (err) { return; }
  if (!Auth.current() && /^#\/(claims|profile|share|edit|join|verify|claimed)/.test(location.hash)) { render(); return; }
  const typing = document.activeElement && document.activeElement.matches('input,textarea,select');
  if (!typing && !/^#\/(share|edit|login|signup|forgot|newbuilding)/.test(location.hash)) render({ keepScroll: true });
});
window.addEventListener('hashchange', (e) => {
  try { prevHash = new URL(e.oldURL).hash; } catch (err) { prevHash = ''; }
  render();
});

/* Keeps countdowns fresh without redrawing the page (so forms are not wiped),
   and hides food that has just expired. */
setInterval(() => {
  let expired = false;
  $$('[data-until]').forEach((el) => {
    const until = Number(el.dataset.until), t = timeLeft(until);
    el.textContent = t.text; el.className = 'badge ' + t.cls;
    if (until <= Date.now()) expired = true;
  });
  if (!expired) return;
  const typing = document.activeElement && document.activeElement.matches('input,textarea,select');
  if (homeRefresh) homeRefresh();
  else if (currentRoute === 'discover' && !typing) render({ keepScroll: true });
}, 30e3);

function logOut() { Auth.logOut(); returnTo = ''; flash = ''; toast('Logged out.'); go('#/home'); }

/* After logging in or finishing a setup step: go to the next step, or back to where the person was. */
function afterAuth() {
  const u = Auth.current();
  if (!u.verified) return go('#/verify');
  if (!isMember(u)) return go('#/join');
  const to = returnTo || '#/home'; returnTo = '';
  go(to);
}

/* =====================================================================
   ANIMATED HERO
   ---------------------------------------------------------------------
   The 3D scene lives in hero3d.js and is only downloaded when the Home
   screen is shown, motion is allowed and data saver is off. Leaving the
   Home screen stops it and frees the GPU.
   ===================================================================== */
let heroStop = null, heroToken = 0;
function unmountHero() { heroToken++; if (heroStop) { heroStop(); heroStop = null; } }
function mountHero(app) {
  const el = $('.hero3d', app); if (!el) return;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  $$('[data-scroll]', el).forEach((a) => a.addEventListener('click', (e) => {
    e.preventDefault();
    const t = document.getElementById(a.dataset.scroll);
    if (t) t.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
  }));
  const saveData = navigator.connection && navigator.connection.saveData;
  if (calm || saveData) { el.classList.add('no-webgl'); return; }   // static glow only
  const mine = ++heroToken;
  import('./hero3d.js').then((m) => {
    if (mine !== heroToken || !el.isConnected) return;               // user already left Home
    heroStop = m.initHero(el);
  }).catch(() => el.classList.add('no-webgl'));                       // offline or blocked
}

  $('#needlogin')?.addEventListener('click', () => { returnTo = location.hash; });

    $('#del').addEventListener('click', () => {

    });
  }
  if (member && !mine && active) {
    const out = $('#n');
    $('#less')?.addEventListener('click', () => { n = Math.max(1, n - 1); out.textContent = n; });
    $('#more')?.addEventListener('click', () => { n = Math.min(leftNow(p), n + 1); out.textContent = n; });
    $('#claim')?.addEventListener('click', () => {
      const claim = DB.makeClaim(p.id, u, n);
      if (!claim) { toast('Sorry, not enough left.'); render({ keepScroll: true }); return; }
      location.hash = '#/claimed/' + claim.id;
    });
    $('#giveback')?.addEventListener('click', () => {
      DB.setClaimStatus(myClaim.id, 'returned'); toast('Given back. Someone else can take it now.'); render({ keepScroll: true });
    });

    const form = $('#rep');
    $('#rep-open').addEventListener('click', () => { form.hidden = !form.hidden; if (!form.hidden) $('#rep-reason').focus(); });
    $('#rep-cancel').addEventListener('click', () => { form.hidden = true; });

      e.preventDefault();
      DB.addReport(p.id, u.id, $('#rep-reason').value, $('#rep-text').value.trim());
      form.hidden = true;
      toast('Thanks. We will review this post.');
    });
  }
}

    need(diet, 'what kind of food it is', 'f-diet');
    need(chosen.size || none, 'an answer about allergens', 'f-allergen');

    const low = ing.toLowerCase();
    const KEYS = { Nuts: /\b(nut|nuts|peanut|almond|cashew|hazelnut|walnut|pistachio|pecan|marzipan|nutella)/, Dairy: /\b(milk|butter|cheese|cream|yogh?urt|yoghurt|quark|whey|ghee|paneer|mozzarella|parmesan|feta)/,
      Gluten: /\b(wheat|flour|bread|pasta|barley|rye|spelt|couscous|semolina|noodle|bulgur|seitan)/, Egg: /\b(egg|eggs|mayo|mayonnaise|meringue)/ };
    const meatRx = /\b(chicken|beef|pork|ham|bacon|salami|sausage|fish|salmon|tuna|shrimp|prawn|lamb|turkey|meat|gelatin)/;
    const miss = Object.keys(KEYS).filter((k) => KEYS[k].test(low) && !chosen.has(k));
    if (diet === 'Vegan' && (chosen.has('Dairy') || chosen.has('Egg') || KEYS.Dairy.test(low) || KEYS.Egg.test(low))) { problems.push('a diet that matches the ingredients (vegan food has no dairy or egg)'); bad.push('f-diet'); }
    if ((diet === 'Vegan' || diet === 'Vegetarian') && meatRx.test(low)) { problems.push('a diet that matches the ingredients (they mention meat or fish)'); bad.push('f-diet'); }
    const err = $('#err');
    if (!problems.length && miss.length && warnedKey !== miss.join()) {
      warnedKey = miss.join();
      err.textContent = `Your ingredients mention ${miss.join(', ').toLowerCase()}. Please tick ${miss.length > 1 ? 'those allergens' : 'that allergen'}, or press Post again if it is correct.`;
      err.hidden = false; $('#f-allergen').classList.add('bad'); $('#f-allergen').scrollIntoView({ block: 'center' });
      return;
    }
    if (problems.length) {
      bad.forEach((id) => $('#' + id).classList.add('bad'));
      err.textContent = 'Please add ' + problems.join(', ') + '.'; err.hidden = false;
      $('.field.bad input, .field.bad textarea, .field.bad select, .field.bad button')?.focus();
      return;
    }
    const until = hours === null ? editing.until
      : hours === 24 ? (() => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(12, 0, 0, 0); return d.getTime(); })()
      : Date.now() + hours * HOUR;
    const data = {
      name, category: $('#cat').value, total, unit: $('#unit').value, ingredients: ing,
      cookedAt: made, until, spot, note: $('#note').value.trim(), photo,
      tags: [diet, ...(spicy ? ['Spicy'] : []), ...WARN_TAGS.filter((t) => chosen.has(t))]
    };
    if (editing) {
      DB.updatePost(editing.id, { ...data, left: total - got });
      toast('Changes saved.'); location.hash = '#/food/' + editing.id; return;
    }
    const post = DB.addPost(user, data);
    if (!post) return;
    toast(APP.demo ? `Posted in ${b.name}. (Demo: saved on this device only.)` : `Your food is live in ${b.name}.`);
    location.hash = '#/food/' + post.id;
  });
}

function pwStrength(pw) {
  if (!pw) return 0;
  if (pw.length < 8) return 1;
  let s = 1;
  if (pw.length >= 12) s++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
  if (/\d/.test(pw)) s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  return Math.min(5, s);
}
const STRENGTH = [['', 0, '#B4531F'], ['Weak', 22, '#B4531F'], ['Weak', 38, '#B4531F'], ['OK', 62, '#C98A1B'], ['Good', 82, '#4E8A4F'], ['Strong', 100, '#2E6B3F']];

    btn.disabled = false;
    if (res.error === 'exists') return formError(app, 'An account with this email already exists. Try logging in.', 'f-email');
    Auth.sendVerification();
    toast('Account created. Check your inbox.');
    go('#/verify');
  });
}

function viewLogin(app) {
  const note = flash; flash = '';
  app.innerHTML = `
    <div class="narrow">
      <div class="pagehead"><h1>Log in</h1><p>Welcome back, neighbor.</p></div>
      ${demoBanner()}
      ${note ? `<div class="note" role="status">${esc(note)}</div>` : ''}
      <form class="form" id="f" novalidate>
        <div class="field" id="f-email"><label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"></div>
        <div class="field" id="f-pw"><label for="pw">Password</label>${pwInput('pw', 'current-password')}</div>
        <p class="err" id="err" role="alert" hidden></p>
        <button class="btn" type="submit">Log in</button>
        <a class="center" href="#/forgot" style="font-weight:700">Forgot your password?</a>
        <p class="muted center" style="margin:0">New here? <a href="#/signup"><b>Create an account</b></a></p>
      </form>
    </div>`;
  wirePw(app);
  $('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mail = normEmail($('#email').value), pass = $('#pw').value;
    if (!EMAIL_RE.test(mail)) return formError(app, 'Please enter the email you signed up with.', 'f-email');
    if (!pass) return formError(app, 'Please enter your password.', 'f-pw');
    formError(app, '');
    const btn = $('button[type="submit"]', app); btn.disabled = true;
    const res = await Auth.logIn(mail, pass);
    btn.disabled = false;
    if (res.error) return formError(app, 'Email or password is wrong.', 'f-pw');
    toast(`Welcome back, ${res.user.name}!`);
    afterAuth();
  });
}

function viewForgot(app) {
  app.innerHTML = `
    <div class="narrow">
      <div class="pagehead"><h1>Reset your password</h1><p>Enter your email and we'll send a link to choose a new one.</p></div>
      ${demoBanner()}
      <form class="form" id="f" novalidate>
        <div class="field" id="f-email"><label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"></div>
        <p class="err" id="err" role="alert" hidden></p>
        <button class="btn" type="submit">Send reset link</button>
        <a class="center" href="#/login" style="font-weight:700">Back to log in</a>
      </form>
      <div id="after"></div>
    </div>`;
  $('#f').addEventListener('submit', (e) => {
    e.preventDefault();
    const mail = normEmail($('#email').value);
    if (!EMAIL_RE.test(mail)) return formError(app, 'That email address does not look right.', 'f-email');
    formError(app, '');
    $('#f').hidden = true;
    $('#after').innerHTML = `
      <div class="panel" style="margin-top:16px">
        <b>Check your inbox</b>
        <span class="muted" style="font-size:14px">If there is an account for ${esc(mail)}, we've sent a link to reset the password. Check your spam folder too.</span>
      </div>
      ${APP.demo ? `
      <form class="form panel" id="nf" novalidate style="margin-top:12px">
        <b>Demo step: choose a new password</b>
        <span class="muted" style="font-size:14px">In the real app you'd get this step by clicking the link in the email.</span>
        <div class="field" id="f-pw"><label for="pw">New password</label>${pwInput('pw', 'new-password')}</div>
        <p class="err" id="err2" role="alert" hidden></p>
        <button class="btn" type="submit">Save new password</button>
      </form>` : ''}`;
    wirePw(app);
    $('#nf')?.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const showErr = (m) => { const x = $('#err2'); x.textContent = m; x.hidden = !m; };
      const bad = pwProblem($('#pw').value);
      if (bad) return showErr(bad);
      const res = await Auth.resetPassword(mail, $('#pw').value);
      if (res.error) return showErr('There is no demo account with this email.');
      toast('Password changed. Please log in.');
      go('#/login');
    });
  });
}

function viewVerify(app) {
  const u = Auth.current();
  let wait = 0, timer = null;
  app.innerHTML = `
    <div class="narrow done">
      <div style="color:var(--green)">${svg('mail', 72)}</div>
      <h1>Check your inbox</h1>
      <p class="muted" style="margin:8px 0 0;font-size:17px">We sent a link to <b style="color:var(--ink)">${esc(u.email)}</b>. Open it to confirm your email. Check your spam folder too.</p>
      ${demoBanner()}
      <div style="display:grid;gap:10px;margin-top:20px">
        ${APP.demo ? `<button class="btn" id="sim" type="button">Demo: I clicked the link in the email</button>` : ''}
        <button class="btn ghost" id="resend" type="button">Resend email</button>
        <button class="linkbtn" id="other" type="button" style="color:var(--green)">Wrong address? Use a different email</button>
        <button class="linkbtn" id="vlogout" type="button">Log out</button>
      </div>
    </div>`;
  $('#vlogout').addEventListener('click', logOut);
  $('#sim')?.addEventListener('click', () => { Auth.verifyEmail(); toast('Email confirmed. One more step.'); go('#/join'); });
  $('#resend').addEventListener('click', () => {
    Auth.sendVerification(); toast('Sent again. Check your inbox.');
    wait = 30; const b = $('#resend'); b.disabled = true;
    clearInterval(timer);
    timer = setInterval(() => {
      wait--;
      if (!b.isConnected) return clearInterval(timer);
      if (wait <= 0) { clearInterval(timer); b.disabled = false; b.textContent = 'Resend email'; }
      else b.textContent = `Resend in ${wait}s`;
    }, 1000);
    b.textContent = `Resend in ${wait}s`;
  });
  $('#other').addEventListener('click', () => {
    if (confirm('Remove this account and start again with another email?')) { Auth.deleteAccount(); returnTo = ''; go('#/signup'); }
  });
}

let joinFails = 0, joinLockUntil = 0;
function viewJoin(app) {
  const u = Auth.current(), cur = isMember(u) ? DB.building(u.buildingId) : null;
  app.innerHTML = `
    <div class="narrow">
      <div class="pagehead"><h1>${cur ? 'Change building' : 'Join your building'}</h1><p>Neighborly works building by building. Enter the code a neighbor gave you.</p></div>
      ${cur ? `<div class="note">You're in <b>${esc(cur.name)}</b>. Joining another building removes you and your posts from it.</div>` : ''}
      ${APP.demo ? `<div class="note demo" role="note"><b>Demo:</b> try the code <b>DEMO-B</b> (or DEMO-A).</div>` : ''}
      <form class="form" id="f" novalidate>
        <div class="field" id="f-code"><label for="code">Building code</label>
          <input id="code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. K7PM-4TQ2" style="letter-spacing:.1em;font-weight:700">
          <small>Ask a neighbor or look for it on your building's notice board.</small></div>
        <p class="err" id="err" role="alert" hidden></p>
        <button class="btn" type="submit">Join building</button>
      </form>
      <div class="panel" style="margin-top:18px">
        <b>Your building isn't here yet?</b>
        <span class="muted" style="font-size:14px">Create it in a minute. You'll get a code to share with your neighbors.</span>
        <a class="btn ghost" href="#/newbuilding">Create my building</a>
      </div>
      <p class="center" style="margin-top:16px"><button class="linkbtn" id="out" type="button" style="color:var(--muted)">Log out</button></p>
    </div>`;
  $('#out').addEventListener('click', logOut);
  $('#f').addEventListener('submit', (e) => {
    e.preventDefault();
    if (Date.now() < joinLockUntil) return formError(app, `Too many tries. Wait ${Math.ceil((joinLockUntil - Date.now()) / 1000)} seconds.`, 'f-code');
    const code = $('#code').value;
    if (normCode(code).length < 5) return formError(app, 'Please enter the full code.', 'f-code');
    const res = Auth.joinBuilding(code);
    if (res.error) {
      joinFails++;
      if (joinFails >= 5) { joinFails = 0; joinLockUntil = Date.now() + 30e3; return formError(app, 'Too many tries. Please wait 30 seconds.', 'f-code'); }
      return formError(app, "That code doesn't match a building. Check it with your neighbor.", 'f-code');
    }
    joinFails = 0;
    toast(`Welcome to ${res.building.name}!`);
    afterAuth();
  });
}

function viewNewBuilding(app) {
  app.innerHTML = `
    <div class="narrow">
      <div class="pagehead"><h1>Create your building</h1><p>You'll be its admin and get a code to share with neighbors.</p></div>
      <form class="form" id="f" novalidate>
        <div class="field" id="f-name"><label for="bname">Building name</label>
          <input id="bname" maxlength="40" placeholder="e.g. Building Y or Rosenweg 12"><small>Don't include flat numbers.</small></div>
        <div class="two">
          <div class="field" id="f-city"><label for="city">City (optional)</label><input id="city" maxlength="40" autocomplete="address-level2"></div>
          <div class="field" id="f-zip"><label for="zip">Postcode (optional)</label><input id="zip" maxlength="5" inputmode="numeric" autocomplete="postal-code"></div>
        </div>
        <div class="field" id="f-spots"><label for="spots">Pickup spots (one per line)</label>
          <textarea id="spots" maxlength="300" placeholder="Table by the mailboxes&#10;Lobby fridge"></textarea>
          <small>Shared places where food can be left. You can change them later.</small></div>
        <p class="err" id="err" role="alert" hidden></p>
        <button class="btn" type="submit">Create building</button>
        <a class="center" href="#/join" style="font-weight:700">Back</a>
      </form>
    </div>`;
  $('#f').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#bname').value.trim(), city = $('#city').value.trim(), zip = $('#zip').value.trim();
    const spots = [...new Set($('#spots').value.split('\n').map((s) => s.trim()).filter(Boolean))];
    if (name.length < 2) return formError(app, 'Please give your building a name.', 'f-name');
    if (zip && !/^\d{4,5}$/.test(zip)) return formError(app, 'A postcode has 4 or 5 digits.', 'f-zip');
    if (!spots.length) return formError(app, 'Add at least one pickup spot.', 'f-spots');
    if (spots.length > 8 || spots.some((s) => s.length > 40)) return formError(app, 'Use up to 8 spots, each under 40 characters.', 'f-spots');
    const b = Auth.createBuilding({ name, city, postcode: zip, spots });
    if (!b) return formError(app, 'Something went wrong. Please try again.');
    go('#/buildingready');
  });
}

function viewBuildingReady(app) {
  const u = Auth.current(), b = DB.building(u.buildingId);
  const link = location.origin + location.pathname;
  const msg = `Join ${b.name} on Neighborly to share and find free food. Use this code after you sign up: ${b.code} ${link}`;
  app.innerHTML = `
    <div class="narrow done">
      <div style="color:var(--green)">${svg('home2', 72)}</div>
      <h1>${esc(b.name)} is ready!</h1>
      <p class="muted" style="margin:8px 0 14px;font-size:17px">Share this code with your neighbors. They'll need it to join.</p>
      <div class="codebox" id="codebox" aria-label="Building code">${esc(b.code)}</div>
      <div style="display:grid;gap:10px;margin-top:16px">
        <button class="btn" id="copy" type="button">Copy code</button>
        <a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${svg('wa', 18)} Share via WhatsApp</a>
        <a class="btn ghost" href="#/home">Continue to Neighborly</a>
      </div>
      <p class="muted" style="font-size:13px;margin-top:14px">You can find the code again in your profile. If it leaks, you can make a new one there.</p>
    </div>`;
  $('#copy').addEventListener('click', () => copyText(b.code, 'Code copied.'));
}

function viewProfile(app) {
  const user = Auth.current(), b = DB.building(user.buildingId), admin = b.adminId === user.id;
  const mine = DB.posts(b.id).filter((p) => p.ownerId === user.id);
  const claims = DB.claimsFor(user.id).filter((c) => c.status !== 'returned');
  const sharedPortions = mine.reduce((s, p) => s + DB.claimedPortions(p.id), 0);
  const claimedP = claims.reduce((s, c) => s + c.portions, 0);
  const members = DB.members(b.id);
  const link = location.origin + location.pathname;
  app.innerHTML = `
    <div class="narrow">
      <div class="profilehead">
        <span class="av" id="av">${initial(user.name)}</span>
        <div style="flex:1">
          <h1 class="serif" style="font-size:28px">${esc(user.name)}</h1>
          <div class="muted" style="font-size:14px">${esc(b.name)}${admin ? ' · admin' : ''}</div>
          <div class="muted" style="font-size:13px">${esc(user.email || '')}</div>
        </div>
      </div>
      <section class="impact">
        <h2 style="font-size:16px;color:var(--green-dk)">Your impact</h2>
        <div class="stats">
          <div><b>${mine.length}</b><span>foods shared</span></div>
          <div><b>${claims.length}</b><span>foods claimed</span></div>
          <div><b>${sharedPortions + claimedP}</b><span>portions saved from the bin</span></div>
        </div>
      </section>
      <form class="form" id="pf">
        <div class="field"><label for="pname">First name</label><input id="pname" maxlength="30" value="${esc(user.name)}" placeholder="Shown on food you share"></div>
        <fieldset class="field"><legend>My allergies</legend>
          <small style="margin-bottom:8px">We'll warn you on food that contains these, and "Safe for me" in Discover hides them.</small>
          <div class="chips" id="alg">${WARN_TAGS.map((t) => `<button type="button" class="chip warn" data-t="${t}" aria-pressed="${(user.allergies || []).includes(t)}">${t}</button>`).join('')}</div>
        </fieldset>
        <button class="btn" type="submit">Save profile</button>
      </form>

      <section class="panel" style="margin-top:16px" aria-labelledby="bh">
        <h2 id="bh" style="font-size:16px">My building: ${esc(b.name)}</h2>
        <div class="muted" style="font-size:14px">${esc([b.postcode, b.city].filter(Boolean).join(' '))}${b.postcode || b.city ? ' · ' : ''}${members.length} ${members.length === 1 ? 'member' : 'members'}</div>
        <div><div class="muted" style="font-size:13px;font-weight:700;margin-bottom:6px">Building code (share it with neighbors)</div>
          <div class="codebox" style="font-size:26px;padding:12px">${esc(b.code)}</div></div>
        <div class="stack2" style="display:grid;gap:10px">
          <button class="btn ghost sm" id="copycode" type="button">Copy code</button>
          <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(`Join ${b.name} on Neighborly. Code after sign-up: ${b.code} ${link}`)}">${svg('wa', 16)} Share via WhatsApp</a>
        </div>
        <details><summary style="cursor:pointer;font-weight:700;padding:6px 0">Members and pickup spots</summary>
          <ul class="members" style="margin-top:8px">${members.map((m) => `<li><span class="av">${initial(m.name)}</span><span style="flex:1">${esc(m.name)}${m.id === b.adminId ? ' (admin)' : ''}${m.id === user.id ? ' (you)' : ''}</span>${admin && m.id !== user.id ? `<button type="button" class="linkbtn" data-remove="${m.id}">Remove</button>` : ''}</li>`).join('')}</ul>
          <p class="muted" style="font-size:14px;margin:12px 0 4px"><b>Pickup spots:</b> ${b.spots.map(esc).join(' · ')}</p>
          ${admin ? `<form id="spotsf" class="form" style="margin-top:8px"><div class="field"><label for="spots">Edit pickup spots (one per line)</label><textarea id="spots" maxlength="300">${esc(b.spots.join('\n'))}</textarea></div><p class="err" id="err" role="alert" hidden></p><button class="btn ghost sm" type="submit">Save spots</button></form>` : ''}
        </details>
        <div class="stack2" style="display:grid;gap:10px">
          ${admin ? `<button class="btn danger sm" id="newcode" type="button">Make a new code</button>` : ''}
          <button class="btn danger sm" id="leave" type="button">Leave building</button>
        </div>
      </section>

      <div class="alertcard">${svg('bell', 26, 'style="color:#CFE3BF;flex-shrink:0"')}<div><b>Alerts for new food <span class="badge" style="margin-left:4px">Soon</span></b><small>Coming in a later version.</small></div></div>
      <div class="panel" style="margin-top:16px">
        <b>Your account</b>
        <div class="stack2" style="display:grid;gap:10px">
          <button class="btn dark sm" id="logout" type="button">Log out</button>
          <button class="btn danger sm" id="delacc" type="button">Delete my account</button>
        </div>
      </div>
      ${APP.demo ? `<div class="panel" style="margin-top:16px">
        <b>About this version</b>
        <p class="muted" style="margin:0;font-size:14px">This is a demo. Accounts, buildings and posts are saved on this device only, and the sample neighbors show how the app works. The next version connects a shared database so everyone sees the same feed.</p>
        <button class="btn danger sm" id="reset" type="button">Reset all demo data</button>
      </div>` : ''}
    </div>`;
  const allergies = new Set(user.allergies || []);
  $('#alg').addEventListener('click', (e) => {
    const bt = e.target.closest('[data-t]'); if (!bt) return;
    const t = bt.dataset.t; allergies.has(t) ? allergies.delete(t) : allergies.add(t);
    bt.setAttribute('aria-pressed', allergies.has(t));
  });
  $('#pf').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#pname').value.trim();
    if (!name) { toast('Please add your first name.'); return; }
    Auth.setProfile({ name, allergies: [...allergies] });
    toast('Profile saved'); render({ keepScroll: true });
  });
  $('#copycode').addEventListener('click', () => copyText(b.code, 'Code copied.'));
  $('#newcode')?.addEventListener('click', () => {
    if (confirm('Make a new code? The old code stops working for new neighbors.')) { DB.regenerateCode(b.id); toast('New code ready.'); render({ keepScroll: true }); }
  });
  $$('[data-remove]').forEach((bt) => bt.addEventListener('click', () => {
    if (confirm('Remove this neighbor from the building? Their posts are removed too.')) { DB.removeMember(user.id, bt.dataset.remove); toast('Neighbor removed.'); render({ keepScroll: true }); }
  }));
  $('#spotsf')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const spots = [...new Set($('#spots').value.split('\n').map((s) => s.trim()).filter(Boolean))];
    const err = $('#err');
    if (!spots.length || spots.length > 8 || spots.some((s) => s.length > 40)) { err.textContent = 'Use 1 to 8 spots, each under 40 characters.'; err.hidden = false; return; }
    DB.setSpots(b.id, spots); toast('Pickup spots saved.'); render({ keepScroll: true });
  });
  $('#leave').addEventListener('click', () => {
    if (confirm('Leave this building? Your posts and claims here are removed.')) { Auth.leaveBuilding(); toast('You left the building.'); go('#/join'); }
  });
  $('#logout').addEventListener('click', logOut);
  $('#delacc').addEventListener('click', () => {
    if (confirm('Delete your account for good? Your posts and claims are removed.')) { Auth.deleteAccount(); toast('Account deleted.'); go('#/home'); }
  });
  $('#reset')?.addEventListener('click', () => {
    if (confirm('Reset everything on this device back to the sample data? This removes all demo accounts and posts.')) { DB.reset(); toast('Demo data reset.'); go('#/home'); }
  });
}

   START
   ===================================================================== */
$('#bell').addEventListener('click', () => toast('Alerts are coming in a later version.'));
if (!persistOK) {
  $('#app').insertAdjacentHTML('beforebegin', `<div class="note demo" style="max-width:1088px;margin:8px auto 0" role="alert">Your browser blocks saving, so nothing you do will be kept after you close this page.</div>`);
}
render();
</script>
</body>
</html>
